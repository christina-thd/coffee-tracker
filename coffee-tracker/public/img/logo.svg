<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App logo: a cup of coffee with steam, and a bean on the saucer.
       Also the source of icon.png and the home-screen icons (art/render.sh). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3a96b"/>
      <stop offset="1" stop-color="#9c5a2a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- steam -->
  <path d="M206 92c-18 22 18 38 0 62M256 78c-18 24 18 42 0 70M306 92c-18 22 18 38 0 62" fill="none" stroke="#fff4e8"
    stroke-opacity="0.8" stroke-width="16" stroke-linecap="round"/>

  <!-- saucer -->
  <ellipse cx="256" cy="398" rx="170" ry="34" fill="#2a1a10" fill-opacity="0.35"/>
  <!-- cup and handle -->
  <path d="M352 236h18a46 46 0 0 1 0 92h-30" fill="none" stroke="#fff4e8" stroke-width="26"/>
  <path d="M120 196h264v88a106 106 0 0 1-106 106h-52a106 106 0 0 1-106-106z" fill="#fff4e8"/>
  <!-- the coffee -->
  <ellipse cx="252" cy="196" rx="132" ry="22" fill="#3b2314"/>

  <!-- a bean on the saucer -->
  <g transform="translate(412 382) rotate(35)">
    <ellipse rx="24" ry="34" fill="#3b2314"/>
    <path d="M-9 26c11-9 5-21 9-28s8-14 7-24" fill="none" stroke="#c98a52" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
