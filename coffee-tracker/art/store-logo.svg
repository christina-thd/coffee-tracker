<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 250 100" width="250" height="100">
  <!-- Banner for the Home Assistant add-on page (rendered to ../logo.png, see docs/DEVELOPMENT.md).
       Reuses the app logo; the text has a dark outline so it reads on light and dark themes. -->
  <image x="6" y="10" width="80" height="80" xlink:href="../public/img/logo.svg" href="../public/img/logo.svg"/>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="700" stroke="#1f130a" stroke-linejoin="round" paint-order="stroke">
    <text x="96" y="48" font-size="25" fill="#f4ede6" stroke-width="4.5">Bean</text>
    <text x="96" y="78" font-size="25" fill="#e3a96b" stroke-width="4.5">There</text>
  </g>
</svg>
